<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>Events · MHS Hub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="site-nav"></header>
  <main class="container" id="main">
    <noscript><p class="notice">MHS Hub needs JavaScript turned on to work.</p></noscript>
    <h1>Events</h1>
    <p class="muted small">Shared with everyone on the site. For the official calendar, see
      <a href="https://www.masd.k12.wi.us/Calendar/" target="_blank" rel="noopener noreferrer">masd.k12.wi.us/Calendar</a>.</p>
    <div class="card" id="add-card" hidden>
      <h2>Add an event</h2>
      <form id="event-form" class="form-grid">
        <label class="wide"><span>Title</span><input type="text" id="title" required maxlength="120" /></label>
        <label><span>Date</span><input type="date" id="date" required /></label>
        <label><span>Time (optional)</span><input type="time" id="time" /></label>
        <label class="wide"><span>Details (optional)</span><input type="text" id="description" maxlength="500" /></label>
        <div class="wide"><button class="btn" type="submit">Add event</button></div>
      </form>
    </div>
    <div class="card" id="signin-card" hidden><p><a href="login.html?next=events.html">Sign in</a> to add an event.</p></div>
    <div class="card">
      <h2>Upcoming</h2>
      <div id="upcoming"><p class="muted">Loading…</p></div>
    </div>
    <details class="card" id="past-card" hidden>
      <summary>Past events</summary>
      <div id="past"></div>
    </details>
  </main>
  <script src="js/calendar.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/events.js"></script>
</body>
</html>
