<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#183890" />
  <title>Events · MHS Today</title>
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/app-icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MHS Today" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="site-nav"></header>
  <main class="container" id="main">
    <noscript><p class="notice">MHS Today needs JavaScript turned on to work.</p></noscript>
    <h1>Events</h1>
    <p class="muted small">Events for everyone, for your groups, and private ones you're invited to. For the official calendar, see
      <a href="https://www.masd.k12.wi.us/Calendar/" target="_blank" rel="noopener noreferrer">masd.k12.wi.us/Calendar</a>.</p>
    <details class="card" id="add-card" hidden>
      <summary>Add an event</summary>
      <p class="small muted" id="post-note" hidden></p>
      <form id="event-form" class="form-grid">
        <label class="wide"><span>Title</span><input type="text" id="title" required maxlength="120" /></label>
        <label><span>Date</span><input type="date" id="date" required /></label>
        <label><span>Ends (if it's more than one day)</span><input type="date" id="end-date" /></label>
        <label><span>Starts (optional)</span><input type="time" id="time" /></label>
        <label><span>Ends (optional)</span><input type="time" id="end-time" /></label>
        <label><span>Where (room or address)</span><input type="text" id="location" maxlength="120" placeholder="Rm 173, Main Gym, 1234 Main St…" /></label>
        <label id="category-field"><span>Kind of event</span><select id="ev-category"><option value="school">School</option><option value="sports">Sports</option><option value="clubs">Clubs</option><option value="community">Community</option><option value="holidays">Holidays</option></select></label>
        <label class="wide"><span>Details (optional)</span><input type="text" id="description" maxlength="500" /></label>
        <label><span>Who can see it</span><select id="ev-visibility"></select></label>
        <label id="group-field"><span>Group</span><select id="ev-group"></select></label>
        <p class="small muted wide" id="group-note" role="status"></p>
        <fieldset class="wide" id="invite-field" hidden><legend class="field-label">Invite friends</legend><div class="checklist-box" id="invite-list"></div></fieldset>
        <label class="check"><input type="checkbox" id="ev-signup" /><span>Add a sign-up list</span></label>
        <label id="limit-field" hidden><span>Spots (empty = no limit)</span><input type="number" id="ev-limit" min="1" max="500" inputmode="numeric" /></label>
        <div class="wide"><button class="btn" type="submit">Add event</button></div>
      </form>
    </details>
    <div class="card">
      <div class="row between"><h2>Upcoming</h2>
        <label class="inline-select"><span class="sr-only">Show</span><select id="cat-filter"><option value="">All kinds</option><option value="school">School</option><option value="sports">Sports</option><option value="clubs">Clubs</option><option value="community">Community</option><option value="holidays">Holidays</option></select></label></div>
      <div id="upcoming"><p class="muted">Loading…</p></div>
    </div>
    <details class="card" id="past-card" hidden>
      <summary>Past events</summary>
      <div id="past"></div>
    </details>
  </main>
  <script src="js/calendar.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/events.js"></script>
</body>
</html>
