<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>My Schedule · MHS Hub</title>
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icon-167.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="site-nav"></header>
  <main class="container" id="main">
    <noscript><p class="notice">MHS Hub needs JavaScript turned on to work.</p></noscript>
    <h1>My Schedule</h1>
    <p class="muted">Each class belongs to a color block. Enter each class once, and the day letter decides which hour it meets in.</p>
    <div class="card">
      <h2>Your classes</h2>
      <form id="schedule-form" autocomplete="off"><div id="blocks"></div></form>
      <p class="small muted" id="lunch-help"></p>
      <div class="row"><button class="btn secondary small" type="button" id="clear-btn">Clear all</button></div>
    </div>
    <div class="row">
      <button class="btn" type="button" id="save-btn">Save schedule</button>
      <span class="small muted" id="save-state" role="status"></span>
    </div>
    <div class="card">
      <h2>Rotation</h2>
      <p class="small muted">Where each block meets on Days A–D. Today's day is outlined.</p>
      <div class="table-wrap"><table class="rotation-table" id="rotation"></table></div>
    </div>
  </main>
  <script src="js/calendar.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/schedule.js"></script>
</body>
</html>
