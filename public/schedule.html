<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>My Schedule · MHS Hub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="site-nav"></header>
  <main class="container" id="main">
    <noscript><p class="notice">MHS Hub needs JavaScript turned on to work.</p></noscript>
    <h1>My Schedule</h1>
    <p class="muted">Enter your class for each hour on each rotation day. Tip: fill in one day, then use <strong>Copy to other days</strong> if your classes repeat.</p>
    <div class="card">
      <div class="tabs" role="tablist" aria-label="Rotation day" id="tabs"></div>
      <form id="schedule-form" autocomplete="off"><div id="panels"></div></form>
      <div class="row" id="day-actions"></div>
    </div>
    <div class="row">
      <button class="btn" type="button" id="save-btn">Save schedule</button>
      <span class="small muted" id="save-state" role="status"></span>
    </div>
  </main>
  <script src="js/calendar.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/schedule.js"></script>
</body>
</html>
