<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1636" />
  <title>Simple mode · MHS Today</title>
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/app-icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="simple-page">
  <!-- Just the clock, the block you're in and the time left, big: for a classroom screen, a Chromebook
       on the desk, or a box on another website. Bookmark it, or embed it:
       /simple?next=1 also shows what's next, /simple?schedule=1 also shows the day's bell schedule. -->
  <main class="simple-mode" id="main">
    <noscript><p>MHS Today needs JavaScript turned on to work.</p></noscript>
    <div class="sm-bar">
      <a class="sm-btn" id="sm-home" href="/">Today</a>
      <button class="sm-btn" id="sm-options-btn" type="button" aria-expanded="false" aria-controls="sm-options">Options</button>
      <button class="sm-btn" id="sm-full" type="button" hidden>Full screen</button>
    </div>
    <div class="sm-options" id="sm-options" hidden>
      <label class="sm-check"><input type="checkbox" id="opt-next" /> Show what's next</label>
      <label class="sm-check"><input type="checkbox" id="opt-schedule" /> Show the full schedule</label>
      <div class="sm-option-btns">
        <button class="sm-btn" id="copy-link" type="button">Copy link</button>
        <button class="sm-btn" id="copy-embed" type="button">Copy embed code</button>
      </div>
      <p class="sm-hint" id="sm-hint"></p>
    </div>
    <div class="sm-main">
      <div class="sm-date" id="sm-date"></div>
      <div class="sm-clock" id="sm-clock" aria-live="off"><span id="sm-hm"></span><span class="sm-ampm" id="sm-ampm"></span></div>
      <div class="sm-title" id="sm-title"></div>
      <div class="sm-left" id="sm-left" hidden><strong id="sm-left-num"></strong><span id="sm-left-label"></span></div>
      <div class="sm-next" id="sm-next" hidden></div>
      <p class="sm-error" id="sm-error" hidden></p>
    </div>
    <ol class="sm-schedule" id="sm-schedule" hidden aria-label="Today's bell schedule"></ol>
  </main>
  <script src="/js/calendar.js"></script>
  <script src="/js/bellSchedule.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pages/simple.js"></script>
</body>
</html>
