<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#183890" />
  <title>Lesson plans · MHS Today</title>
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/app-icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MHS Today" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="site-nav"></header>
  <main class="container" id="main">
    <noscript><p class="notice">MHS Today needs JavaScript turned on to work.</p></noscript>
    <h1>Lesson plans</h1>
    <p class="muted">What each of your classes is doing, day by day. Students in your classes see it next to the class on their Today page and calendar. It saves as you type.</p>
    <div class="card">
      <div class="row between month-head">
        <h2 id="week-title">This week</h2>
        <div class="row nowrap">
          <button class="btn small secondary" type="button" id="week-prev" aria-label="Previous week">←</button>
          <button class="btn small secondary" type="button" id="week-today">This week</button>
          <button class="btn small secondary" type="button" id="week-next" aria-label="Next week">→</button>
        </div>
      </div>
      <div class="plan-week" id="week"><p class="muted">Loading…</p></div>
    </div>
  </main>
  <script src="js/calendar.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/plans.js"></script>
</body>
</html>
