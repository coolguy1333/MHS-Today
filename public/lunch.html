<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>Lunch · MHS Hub</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="site-nav"></header>
  <main class="container" id="main">
    <noscript><p class="notice">MHS Hub needs JavaScript turned on to work.</p></noscript>
    <div class="card" id="lunch-head"><p class="muted">Loading…</p></div>
    <div class="grid grid-2">
      <div class="card">
        <h2>On the menu</h2>
        <div id="menu"><p class="muted">Loading…</p></div>
        <p class="small muted" id="menu-source" hidden></p>
      </div>
      <div class="card">
        <h2>Your lunch</h2>
        <div id="my-lunch"><p class="muted">Loading…</p></div>
      </div>
    </div>
  </main>
  <script src="js/calendar.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/lunch.js"></script>
</body>
</html>
