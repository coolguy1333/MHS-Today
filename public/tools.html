<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tools · MHS Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav" id="site-nav"></header>
  <div class="container">
    <h1>Tools</h1>
    <p class="muted">A growing set of tools. More coming eventually.</p>

    <div class="tool-grid" id="tool-grid"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    renderNav('tools');

    // Class Cards is being built as its own app elsewhere in this project.
    // Update this URL once it's deployed (or edit directly here).
    const TOOLS = [
      {
        name: 'Class Cards',
        description: 'Flashcards for your classes — built as its own app.',
        url: '', // e.g. 'http://your-classcards-url'
      }
    ];

    const grid = document.getElementById('tool-grid');
    grid.innerHTML = TOOLS.map(t => {
      const ready = !!t.url;
      return `
        <a class="card tool-card" href="${ready ? t.url : '#'}" ${ready ? 'target="_blank" rel="noopener"' : 'onclick="return false;"'}>
          <h3>${t.name}</h3>
          <p>${t.description}</p>
          ${!ready ? '<span class="badge muted" style="margin-top:8px;">Coming soon</span>' : ''}
        </a>
      `;
    }).join('') + `
      <div class="card tool-card" style="opacity:0.6;">
        <h3>+ More tools</h3>
        <p>New tools will show up here over time.</p>
      </div>
    `;
  </script>
</body>
</html>
