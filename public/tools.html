<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>Tools · MHS Hub</title>
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icon-167.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="site-nav"></header>
  <main class="container" id="main">
    <noscript><p class="notice">MHS Hub needs JavaScript turned on to work.</p></noscript>
    <h1>Tools</h1>
    <p class="muted">Extra tools for MHS students.</p>
    <div class="tool-grid" id="tool-grid"><p class="muted">Loading…</p></div>
    <details class="card" id="suggest-card" hidden>
      <summary>Suggest a tool</summary>
      <p class="small muted">Know a useful site, or have an idea for one? Admins look at every suggestion.</p>
      <form id="suggest-form" class="form-grid">
        <label><span>Name</span><input type="text" id="t-name" maxlength="60" required /></label>
        <label><span>Web address (if it exists)</span><input type="url" id="t-url" maxlength="500" placeholder="https://…" /></label>
        <label class="wide"><span>What it does</span><input type="text" id="t-description" maxlength="200" /></label>
        <div class="wide"><button class="btn" type="submit">Send suggestion</button></div>
      </form>
    </details>
  </main>
  <script src="js/calendar.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/tools.js"></script>
</body>
</html>
