<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · MHS Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav" id="site-nav"></header>
  <div class="container">

    <div class="card">
      <div class="flex-between">
        <div>
          <h1 class="mt0">Today</h1>
          <p class="muted mt0" id="today-summary">Loading…</p>
        </div>
        <div class="flex">
          <select id="schedule-type"></select>
          <select id="day-letter">
            <option value="A">Day A</option>
            <option value="B">Day B</option>
            <option value="C">Day C</option>
            <option value="D">Day D</option>
          </select>
        </div>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h2 class="mt0">Schedule</h2>
        <table>
          <thead><tr><th>Period</th><th>Time</th><th>Class</th></tr></thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>

      <div>
        <div class="card">
          <h2 class="mt0">Upcoming events</h2>
          <div id="events-preview"><p class="muted">Loading…</p></div>
          <a class="small" href="events.html">See all events →</a>
        </div>

        <div class="card">
          <h2 class="mt0">Friends</h2>
          <div id="friends-preview"><p class="muted small">Loading…</p></div>
          <a class="small" href="friends.html">Manage friends →</a>
        </div>
      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script>
    renderNav('dashboard');

    const typeSelect = document.getElementById('schedule-type');
    Object.values(SCHEDULES).forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.key;
      opt.textContent = s.label;
      typeSelect.appendChild(opt);
    });
    const daySelect = document.getElementById('day-letter');

    let state = { today: { scheduleType: 'daily', dayLetter: 'A' }, classes: {}, events: [], friends: null, me: null };

    function render() {
      const t = state.today;
      const schedule = SCHEDULES[t.scheduleType] || SCHEDULES.daily;
      const current = getCurrentPeriod(t.scheduleType, new Date());
      const classes = state.classes;
      typeSelect.value = t.scheduleType;
      daySelect.value = t.dayLetter;

      let summary = `${schedule.label} · Day <strong>${t.dayLetter}</strong> — `;
      if (current.status === 'in-class') {
        summary += `<span class="badge">Period ${current.period.hour} in progress</span>`;
      } else if (current.status === 'before-school') {
        summary += `<span class="badge muted">Before school</span>`;
      } else if (current.status === 'passing') {
        summary += `<span class="badge blue">Passing period</span>`;
      } else {
        summary += `<span class="badge muted">School's out</span>`;
      }
      document.getElementById('today-summary').innerHTML = summary;

      const body = document.getElementById('schedule-body');
      body.innerHTML = '';
      schedule.periods.forEach(p => {
        const isCurrent = current.status === 'in-class' && current.period.hour === p.hour;
        const cls = classes[`${t.dayLetter}_${p.hour}`];
        const tr = document.createElement('tr');
        tr.className = 'period-row' + (isCurrent ? ' current' : '');
        let classCell;
        if (cls && cls.name) {
          classCell = `<strong>${escapeHtml(cls.name)}</strong>` + (cls.room ? ` <span class="muted small">· Rm ${escapeHtml(cls.room)}</span>` : '');
        } else if (p.hour === 'advisory') {
          classCell = `<span class="muted">Advisory</span>`;
        } else if (state.me) {
          classCell = `<span class="muted small">Not set — <a href="schedule.html">add it</a></span>`;
        } else {
          classCell = `<span class="muted small"><a href="login.html">Sign in</a> to see your classes</span>`;
        }
        tr.innerHTML = `<td>${p.label}</td><td class="small muted">${p.start}–${p.end}</td><td>${classCell}</td>`;
        body.appendChild(tr);
      });

      const todayStr = new Date().toLocaleDateString('en-CA'); // local YYYY-MM-DD
      const events = state.events
        .slice()
        .sort((a, b) => a.date.localeCompare(b.date))
        .filter(e => e.date >= todayStr)
        .slice(0, 5);
      const preview = document.getElementById('events-preview');
      if (events.length === 0) {
        preview.innerHTML = `<p class="muted">No upcoming events yet. <a href="events.html">Add one</a>.</p>`;
      } else {
        preview.innerHTML = events.map(e => `
          <div style="margin-bottom:10px;">
            <strong>${escapeHtml(e.title)}</strong><br/>
            <span class="small muted">${escapeHtml(e.date)}${e.time ? ' · ' + escapeHtml(e.time) : ''}</span>
          </div>
        `).join('');
      }

      const fp = document.getElementById('friends-preview');
      if (!state.me) {
        fp.innerHTML = `<p class="muted small"><a href="login.html">Sign in</a> to see what your friends are in.</p>`;
      } else if (!state.friends || state.friends.length === 0) {
        fp.innerHTML = `<p class="muted small">No friends added yet.</p>`;
      } else {
        fp.innerHTML = state.friends.map(f => {
          const c = f.classes[`${t.dayLetter}_${current.status === 'in-class' ? current.period.hour : ''}`];
          return `<div style="margin-bottom:6px;"><strong>${escapeHtml(f.username)}</strong> <span class="small muted">${
            current.status === 'in-class' ? (c ? escapeHtml(c.name) + (c.room ? ' · Rm ' + escapeHtml(c.room) : '') : 'no class set') : '—'}</span></div>`;
        }).join('');
      }
    }

    async function load() {
      const me = (await getMe()).user;
      state.me = me;
      const jobs = [api('GET', '/api/today'), api('GET', '/api/events')];
      if (me) jobs.push(api('GET', '/api/classes'), api('GET', '/api/friends'));
      try {
        const [today, events, classes, friends] = await Promise.all(jobs);
        state.today = today;
        state.events = events;
        if (me) { state.classes = classes; state.friends = friends.friends; }
      } catch (e) {
        document.getElementById('today-summary').textContent = 'Could not load data: ' + e.message;
        return;
      }
      const canEdit = !!(me && me.admin);
      typeSelect.disabled = daySelect.disabled = !canEdit;
      typeSelect.title = daySelect.title = canEdit ? '' : 'Only admins can change this';
      render();
    }

    async function updateToday() {
      try {
        state.today = await api('PUT', '/api/today', { scheduleType: typeSelect.value, dayLetter: daySelect.value });
      } catch (e) { alert(e.message); }
      render();
    }
    typeSelect.addEventListener('change', updateToday);
    daySelect.addEventListener('change', updateToday);

    load();
    setInterval(render, 30000); // keep "current period" fresh
    setInterval(load, 5 * 60000); // pick up shared changes (day letter, events)
  </script>
</body>
</html>
