<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>Today · MHS Hub</title>
  <link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/app-icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MHS Hub" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav" id="site-nav"></header>
  <main class="container" id="main">
    <noscript><p class="notice">MHS Hub needs JavaScript turned on to work.</p></noscript>
    <div id="load-error" class="notice error" hidden></div>
    <div class="card" id="day-head"><p class="muted">Loading…</p></div>
    <div class="card status-card" id="status" hidden></div>
    <div class="card setup-card" id="setup-card" hidden></div>
    <div class="card" id="countdown-card" hidden>
      <h2>Countdowns</h2>
      <div class="countdowns" id="countdowns"></div>
    </div>
    <div class="grid grid-2">
      <div>
      <div class="card">
        <h2>Schedule</h2>
        <p class="small muted" id="table-note" hidden></p>
        <table class="schedule-table">
          <thead><tr><th scope="col">Period</th><th scope="col">Time</th><th scope="col">Class</th></tr></thead>
          <tbody id="schedule-body"></tbody>
        </table>
      </div>
      <div class="card" id="weeks-card">
        <h2>Next 2 weeks</h2>
        <div class="weeks" id="weeks"></div>
        <p class="small muted">Pick a day to see its schedule.</p>
      </div>
      </div>
      <div>
        <div class="card" id="tasks-card" hidden>
          <h2>Due soon</h2>
          <div id="tasks-preview"></div>
          <p class="small"><a href="classwork.html">All assignments →</a></p>
        </div>
        <div class="card">
          <h2>Lunch menu</h2>
          <div id="lunch-preview"><p class="muted small">Loading…</p></div>
          <p class="small"><a href="lunch.html">Full menu →</a></p>
        </div>
        <div class="card">
          <h2>Upcoming events</h2>
          <div id="events-preview"><p class="muted">Loading…</p></div>
          <p class="small"><a href="events.html">See all events →</a></p>
        </div>
        <div class="card">
          <h2>Friends right now</h2>
          <div id="friends-preview"><p class="muted small">Loading…</p></div>
        </div>
      </div>
    </div>
  </main>
  <script src="js/calendar.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/index.js"></script>
</body>
</html>
