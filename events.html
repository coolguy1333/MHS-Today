<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events · MHS Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav" id="site-nav"></header>
  <div class="container">
    <h1>Events</h1>
    <p class="muted small">
      Saved in this browser only for now. For the official calendar, see
      <a href="https://www.masd.k12.wi.us/Calendar/" target="_blank" rel="noopener">masd.k12.wi.us/Calendar</a>.
    </p>

    <div class="card">
      <h2 class="mt0">Add an event</h2>
      <form id="event-form" class="grid grid-2">
        <label><span>Title</span><input type="text" id="title" required /></label>
        <label><span>Date</span><input type="date" id="date" required /></label>
        <label><span>Time (optional)</span><input type="time" id="time" /></label>
        <label><span>Description (optional)</span><input type="text" id="description" /></label>
        <button class="btn" type="submit" style="grid-column: 1 / -1;">Add event</button>
      </form>
    </div>

    <div class="card">
      <h2 class="mt0">All events</h2>
      <div id="event-list"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    renderNav('events');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function render() {
      const events = getEvents().slice().sort((a, b) => a.date.localeCompare(b.date));
      const list = document.getElementById('event-list');
      if (events.length === 0) {
        list.innerHTML = `<p class="muted">No events yet.</p>`;
        return;
      }
      list.innerHTML = events.map(e => `
        <div class="event-row">
          <div>
            <strong>${escapeHtml(e.title)}</strong><br/>
            <span class="small muted">${e.date}${e.time ? ' · ' + e.time : ''}</span>
            ${e.description ? `<br/><span class="small">${escapeHtml(e.description)}</span>` : ''}
          </div>
          <button class="linklike" data-id="${e.id}">Delete</button>
        </div>
      `).join('');
      list.querySelectorAll('button[data-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const remaining = getEvents().filter(ev => ev.id !== btn.dataset.id);
          saveEvents(remaining);
          render();
        });
      });
    }

    document.getElementById('event-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const description = document.getElementById('description').value.trim();
      if (!title || !date) return;
      const events = getEvents();
      events.push({ id: cryptoId(), title, date, time, description });
      saveEvents(events);
      e.target.reset();
      render();
    });

    render();
  </script>
</body>
</html>
