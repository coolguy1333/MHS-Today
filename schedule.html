<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Schedule · MHS Hub</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav" id="site-nav"></header>
  <div class="container">
    <h1>My Schedule</h1>
    <p class="muted">Set your class for each hour, on each rotation day (A/B/C/D). Leave a box blank to clear it. Saved in this browser only.</p>

    <div class="class-grid" id="class-grid"></div>
    <button class="btn" id="save-btn">Save schedule</button>
    <span id="saved-msg" class="small muted" style="margin-left:10px; display:none;">Saved ✓</span>
  </div>

  <script src="js/app.js"></script>
  <script src="js/bellSchedule.js"></script>
  <script>
    renderNav('schedule');

    const DAYS = ['A', 'B', 'C', 'D'];
    const HOURS = [1, 2, 3, 4, 5, 6];
    const grid = document.getElementById('class-grid');
    const classes = getClasses();

    DAYS.forEach(day => {
      const col = document.createElement('div');
      col.className = 'class-col';
      col.innerHTML = `<h3>Day ${day}</h3>`;
      HOURS.forEach(hour => {
        const key = `${day}_${hour}`;
        const cls = classes[key] || {};
        const period = SCHEDULES.daily.periods.find(p => p.hour === hour);
        const slot = document.createElement('div');
        slot.className = 'class-slot';
        slot.innerHTML = `
          <div class="hour-label">Hour ${hour} · ${period ? period.start : ''}</div>
          <label><input type="text" data-key="${key}" data-field="name" placeholder="Class name" value="${cls.name || ''}" /></label>
          <label><input type="text" data-key="${key}" data-field="teacher" placeholder="Teacher" value="${cls.teacher || ''}" /></label>
          <label><input type="text" data-key="${key}" data-field="room" placeholder="Room" value="${cls.room || ''}" /></label>
          <input type="color" data-key="${key}" data-field="color" value="${cls.color || '#4f7cff'}" />
        `;
        col.appendChild(slot);
      });
      grid.appendChild(col);
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      const updated = {};
      grid.querySelectorAll('[data-key]').forEach(input => {
        const key = input.dataset.key;
        const field = input.dataset.field;
        updated[key] = updated[key] || {};
        updated[key][field] = input.value;
      });
      // Drop entries with no class name
      Object.keys(updated).forEach(key => {
        if (!updated[key].name || !updated[key].name.trim()) delete updated[key];
      });
      saveClasses(updated);
      const msg = document.getElementById('saved-msg');
      msg.style.display = 'inline';
      setTimeout(() => (msg.style.display = 'none'), 1500);
    });
  </script>
</body>
</html>
